name: Phoenix pipeline

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

env:
  NODE_VERSION: "20"

jobs:
  backend:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    services:
      mongo:
        image: mongo:7
        ports:
          - 27017:27017
    env:
      MONGODB_URI: mongodb://localhost:27017/phoenix_test
      JWT_SECRET: ci-only-secret-that-is-at-least-32-characters-long
    defaults:
      run:
        working-directory: phoenix-backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: phoenix-backend/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm run build
      - run: npm test

  frontend:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: phoenix-frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: phoenix-frontend/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm run build

  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs: [backend, frontend]
    services:
      mongo:
        image: mongo:7
        ports:
          - 27017:27017
    env:
      MONGODB_URI: mongodb://localhost:27017/phoenix_e2e
      JWT_SECRET: ci-only-secret-that-is-at-least-32-characters-long
      NEXT_PUBLIC_API_URL: http://localhost:8000
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: |
            phoenix-backend/package-lock.json
            phoenix-frontend/package-lock.json
      - name: Start backend
        working-directory: phoenix-backend
        run: |
          npm ci
          npm run build
          npm run seed
          npm start &
      - name: Start frontend
        working-directory: phoenix-frontend
        run: |
          npm ci
          npm run build
          npm start &
      - run: ./scripts/wait-for.sh http://localhost:8000/api/health 30
      - run: ./scripts/wait-for.sh http://localhost:3000 30
      - run: ./scripts/smoke.sh http://localhost:8000 http://localhost:3000

  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs: [e2e]
    if: github.ref == 'refs/heads/main'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
      - run: npm install --global vercel@39.3.0
      - name: Deploy backend
        working-directory: phoenix-backend
        run: vercel deploy --prod --yes --token ${{ secrets.VERCEL_TOKEN }}
        env:
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_BACKEND_PROJECT_ID }}
      - name: Deploy frontend
        working-directory: phoenix-frontend
        run: vercel deploy --prod --yes --token ${{ secrets.VERCEL_TOKEN }}
        env:
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_FRONTEND_PROJECT_ID }}

  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs: [deploy]
    if: github.ref == 'refs/heads/main'
    steps:
      - uses: actions/checkout@v4
      - run: ./scripts/smoke.sh "${{ vars.BACKEND_URL }}" "${{ vars.FRONTEND_URL }}" "${{ github.sha }}"
